name: Tests

on:
  workflow_call:
    inputs:
      force:
        description: Run the Odoo test matrix regardless of changed paths
        required: false
        type: boolean
        default: false
  pull_request:
    branches: [18.0]
  push:
    branches: [18.0]

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      run_tests: ${{ steps.filter.outputs.run_tests }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Detect Odoo-related changes
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          FORCE_TESTS: ${{ inputs.force }}
        run: python .github/scripts/filter_odoo_tests.py

  test:
    needs: changes
    if: needs.changes.outputs.run_tests == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - container: ghcr.io/oca/oca-ci/py3.10-odoo18.0:latest
            name: Odoo
          - container: ghcr.io/oca/oca-ci/py3.10-ocb18.0:latest
            name: OCB
    name: Test (${{ matrix.name }})
    container: ${{ matrix.container }}
    services:
      postgres:
        image: postgres:12.0
        env:
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
          POSTGRES_DB: odoo
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      OCA_ENABLE_CHECKLOG_ODOO: "1"
    steps:
      - uses: actions/checkout@v7
      - name: Install addons
        run: oca_install_addons
      - name: Ensure PDF renderer is available
        run: |
          if ! command -v wkhtmltopdf >/dev/null 2>&1; then
            apt-get update
            apt-get install -y wkhtmltopdf
          fi
          wkhtmltopdf --version
          html_file=$(mktemp --suffix=.html)
          pdf_file=$(mktemp --suffix=.pdf)
          trap 'rm -f "$html_file" "$pdf_file"' EXIT
          printf '%s\n' '<html><body>PDF renderer smoke test</body></html>' > "$html_file"
          wkhtmltopdf --quiet --disable-local-file-access "$html_file" "$pdf_file"
          test "$(head -c 5 "$pdf_file")" = '%PDF-'
      - name: Check licenses
        run: manifestoo -d . check-licenses
      - name: Check development status
        run: manifestoo -d . check-dev-status --default-dev-status=Beta
      - name: Initialize test database
        run: oca_init_test_database
      - name: Run addon tests
        run: oca_run_tests
