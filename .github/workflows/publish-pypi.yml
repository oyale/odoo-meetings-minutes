name: Publish Python packages

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.release-packages.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Set metapackage version from the release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          tag = os.environ["RELEASE_TAG"]
          match = re.fullmatch(r"v?(18\.0\.\d+\.\d+)", tag)
          if not match:
              raise SystemExit(
                  f"Release tag {tag!r} must match v18.0.<date-or-sequence>.<revision>"
              )

          import subprocess

          subprocess.run(
              ["git", "fetch", "origin", "18.0:refs/remotes/origin/18.0"],
              check=True,
          )
          subprocess.run(
              ["git", "merge-base", "--is-ancestor", tag, "origin/18.0"],
              check=True,
          )

          path = Path("setup/_metapackage/pyproject.toml")
          content = path.read_text(encoding="utf-8")
          updated, count = re.subn(
              r'(?m)^version = "[^"]+"$',
              f'version = "{match.group(1)}"',
              content,
              count=1,
          )
          if count != 1:
              raise SystemExit("Could not identify the metapackage version")
          path.write_text(updated, encoding="utf-8")
          PY
      - name: Select packages changed since the previous release
        id: release-packages
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess

          addons = {
              "community_meetings": {
                  "addon": "community_meetings",
                  "project": "odoo-addon-community-meetings",
                  "wheel": "odoo_addon_community_meetings-*.whl",
                  "environment": "pypi-community-meetings",
              },
              "community_meetings_calendar": {
                  "addon": "community_meetings_calendar",
                  "project": "odoo-addon-community-meetings-calendar",
                  "wheel": "odoo_addon_community_meetings_calendar-*.whl",
                  "environment": "pypi-community-meetings-calendar",
              },
              "community_meetings_extension_demo": {
                  "addon": "community_meetings_extension_demo",
                  "project": "odoo-addon-community-meetings-extension-demo",
                  "wheel": "odoo_addon_community_meetings_extension_demo-*.whl",
                  "environment": "pypi-community-meetings-extension-demo",
              },
              "community_meetings_project": {
                  "addon": "community_meetings_project",
                  "project": "odoo-addon-community-meetings-project",
                  "wheel": "odoo_addon_community_meetings_project-*.whl",
                  "environment": "pypi-community-meetings-project",
              },
          }
          current = os.environ["RELEASE_TAG"]
          previous = subprocess.run(
              [
                  "git",
                  "describe",
                  "--tags",
                  "--abbrev=0",
                  "--match",
                  "18.0.*",
                  "--match",
                  "v18.0.*",
                  f"{current}^",
              ],
              check=False,
              capture_output=True,
              text=True,
          )
          if previous.returncode:
              changed = set(addons)
          else:
              paths = subprocess.run(
                  ["git", "diff", "--name-only", previous.stdout.strip(), current],
                  check=True,
                  capture_output=True,
                  text=True,
              ).stdout.splitlines()
              changed = {
                  name
                  for name in addons
                  if any(
                      path.startswith(f"{name}/")
                      and not path.startswith(f"{name}/readme/newsfragments/")
                      and path != f"{name}/CHANGELOG.md"
                      for path in paths
                  )
              }

          matrix = [addons[name] for name in addons if name in changed]
          matrix.append(
              {
                  "addon": None,
                  "project": "odoo-meetings-minutes",
                  "wheel": "odoo_meetings_minutes-*.whl",
                  "environment": "pypi",
              }
          )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"matrix={json.dumps(matrix)}\n")
          print("Publishing:", ", ".join(item["project"] for item in matrix))
          PY
      - name: Build addon wheels
        env:
          RELEASE_PACKAGES: ${{ steps.release-packages.outputs.matrix }}
        run: |
          python -m pip install --upgrade build
          python - <<'PY'
          import json
          import os
          import subprocess

          packages = json.loads(os.environ["RELEASE_PACKAGES"])
          for package in packages:
              addon = package["addon"]
              if addon:
                  subprocess.run(
                      ["python", "-m", "build", "--wheel", "--outdir", "dist", addon],
                      check=True,
                  )
          PY
      - name: Build the suite metapackage
        run: python -m build --wheel --outdir dist setup/_metapackage
      - name: Check package metadata
        run: |
          python -m pip install --upgrade twine
          python -m twine check dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: pypi-distributions
          path: dist/*
          if-no-files-found: error

  tests_gate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: read
    outputs:
      passed: ${{ steps.gate.outputs.passed }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Resolve the last code-changing commit at or before the release
        id: resolve
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python .github/scripts/last_code_commit.py > code_commit.txt
          echo "code_commit=$(cat code_commit.txt)" >> "$GITHUB_OUTPUT"
      - name: Reuse the code commit's test run or run the suite
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          CODE_COMMIT: ${{ steps.resolve.outputs.code_commit }}
        run: |
          set -euo pipefail

          run_id=""
          for _ in $(seq 1 12); do
            runs=$(gh api "repos/$REPOSITORY/actions/workflows/test.yml/runs?head_sha=$CODE_COMMIT&per_page=1")
            run_id=$(python -c 'import json,sys; runs=json.load(sys.stdin)["workflow_runs"]; print(runs[0]["id"] if runs else "")' <<<"$runs")
            [ -n "$run_id" ] && break
            sleep 10
          done

          if [ -z "$run_id" ]; then
            echo "No Tests run for the code commit ($CODE_COMMIT); the release test suite will run."
            echo "passed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Waiting for the Tests run ($run_id) at $CODE_COMMIT."
          while true; do
            run=$(gh api "repos/$REPOSITORY/actions/runs/$run_id")
            status=$(python -c 'import json,sys; print(json.load(sys.stdin)["status"])' <<<"$run")
            if [ "$status" = "completed" ]; then
              break
            fi
            sleep 15
          done

          conclusion=$(python -c 'import json,sys; print(json.load(sys.stdin).get("conclusion") or "")' <<<"$run")
          if [ "$conclusion" != "success" ]; then
            echo "Tests run concluded '$conclusion'; the release test suite will run."
            echo "passed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          jobs=$(gh api "repos/$REPOSITORY/actions/runs/$run_id/jobs?per_page=100")
          passed=$(python -c '
          import json, sys
          jobs = json.load(sys.stdin)["jobs"]
          ran = any(job["name"] != "changes" and job["conclusion"] == "success" for job in jobs)
          print(str(ran).lower())
          ' <<<"$jobs")
          echo "Tests actually ran and passed: $passed"
          echo "passed=$passed" >> "$GITHUB_OUTPUT"

  test:
    needs: tests_gate
    if: >-
      ${{ !cancelled() && needs.tests_gate.result == 'success' &&
          needs.tests_gate.outputs.passed != 'true' }}
    uses: ./.github/workflows/test.yml
    with:
      force: true

  publish:
    needs: [build, tests_gate, test]
    if: >-
      ${{ always() && needs.build.result == 'success' &&
          (needs.test.result == 'success' ||
           (needs.test.result == 'skipped' &&
            needs.tests_gate.result == 'success' &&
            needs.tests_gate.outputs.passed == 'true')) }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.build.outputs.packages) }}
    environment:
      name: ${{ matrix.environment }}
      url: https://pypi.org/project/${{ matrix.project }}/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: pypi-distributions
          path: dist
      - name: Select this project's wheel
        env:
          WHEEL_PATTERN: ${{ matrix.wheel }}
        run: |
          mkdir selected-dist
          set -- dist/$WHEEL_PATTERN
          if [ "$#" -ne 1 ] || [ ! -f "$1" ]; then
            echo "Expected exactly one wheel matching $WHEEL_PATTERN"
            exit 1
          fi
          cp "$1" selected-dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: selected-dist/
          skip-existing: true
