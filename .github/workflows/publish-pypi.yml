name: Publish Python packages

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Set metapackage version from the release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          tag = os.environ["RELEASE_TAG"]
          match = re.fullmatch(r"v?(18\.0\.\d+\.\d+)", tag)
          if not match:
              raise SystemExit(
                  f"Release tag {tag!r} must match v18.0.<date-or-sequence>.<revision>"
              )

          import subprocess

          subprocess.run(
              ["git", "fetch", "origin", "18.0:refs/remotes/origin/18.0"],
              check=True,
          )
          subprocess.run(
              ["git", "merge-base", "--is-ancestor", tag, "origin/18.0"],
              check=True,
          )

          path = Path("setup/_metapackage/pyproject.toml")
          content = path.read_text(encoding="utf-8")
          updated, count = re.subn(
              r'(?m)^version = "[^"]+"$',
              f'version = "{match.group(1)}"',
              content,
              count=1,
          )
          if count != 1:
              raise SystemExit("Could not identify the metapackage version")
          path.write_text(updated, encoding="utf-8")
          PY
      - name: Build addon wheels
        run: |
          python -m pip install --upgrade build
          for addon in community_meetings community_meetings_project community_meetings_calendar community_meetings_extension_demo; do
            python -m build --wheel --outdir dist "$addon"
          done
      - name: Build the suite metapackage
        run: python -m build --wheel --outdir dist setup/_metapackage
      - name: Check package metadata
        run: |
          python -m pip install --upgrade twine
          python -m twine check dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: pypi-distributions
          path: dist/*
          if-no-files-found: error

  test:
    uses: ./.github/workflows/test.yml

  publish:
    needs: [build, test]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: odoo-meetings-minutes
            wheel: odoo_meetings_minutes-*.whl
            environment: pypi
          - project: odoo-addon-community-meetings
            wheel: odoo_addon_community_meetings-*.whl
            environment: pypi-community-meetings
          - project: odoo-addon-community-meetings-calendar
            wheel: odoo_addon_community_meetings_calendar-*.whl
            environment: pypi-community-meetings-calendar
          - project: odoo-addon-community-meetings-extension-demo
            wheel: odoo_addon_community_meetings_extension_demo-*.whl
            environment: pypi-community-meetings-extension-demo
          - project: odoo-addon-community-meetings-project
            wheel: odoo_addon_community_meetings_project-*.whl
            environment: pypi-community-meetings-project
    environment:
      name: ${{ matrix.environment }}
      url: https://pypi.org/project/${{ matrix.project }}/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: pypi-distributions
          path: dist
      - name: Select this project's wheel
        env:
          WHEEL_PATTERN: ${{ matrix.wheel }}
        run: |
          mkdir selected-dist
          set -- dist/$WHEEL_PATTERN
          if [ "$#" -ne 1 ] || [ ! -f "$1" ]; then
            echo "Expected exactly one wheel matching $WHEEL_PATTERN"
            exit 1
          fi
          cp "$1" selected-dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: selected-dist/
          skip-existing: true
