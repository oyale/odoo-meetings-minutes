name: Pre-commit (changed files)

on:
  pull_request:
    branches: [18.0]
  push:
    branches: [18.0]

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install pre-commit and Towncrier
        run: python -m pip install pre-commit towncrier==23.11.0
      - name: Install Pandoc for addon README generation
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc
      - uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: Determine change base
        id: changes
        shell: bash
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE: ${{ github.event.before }}
        run: |
          if [[ -n "$PR_BASE" ]]; then
            base="$PR_BASE"
          elif [[ -n "$PUSH_BASE" && "$PUSH_BASE" != "0000000000000000000000000000000000000000" ]]; then
            base="$PUSH_BASE"
          else
            base="$(git rev-parse HEAD^)"
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"
      - name: Require a Towncrier fragment for each changed addon
        env:
          BASE: ${{ steps.changes.outputs.base }}
        run: python .github/scripts/check_towncrier_fragments.py "$BASE" "$GITHUB_SHA"
      - name: Test release helper
        run: python -m unittest discover -s .github/scripts/tests -v
      - name: Check changed files
        env:
          BASE: ${{ steps.changes.outputs.base }}
        shell: bash
        run: |
          base="$BASE"
          git diff --name-only -z --diff-filter=ACMRT "$base" "$GITHUB_SHA" \
            | xargs -0 -r pre-commit run --files
