name: Acceptance tests

on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  behave:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    container: ghcr.io/oca/oca-ci/py3.10-odoo18.0:latest
    services:
      postgres:
        image: postgres:12.0
        env:
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: postgres
      PGUSER: odoo
      PGPASSWORD: odoo
      PGDATABASE: acceptance
      OCA_ENABLE_CHECKLOG_ODOO: "1"
      ACCEPTANCE_ACTOR_PASSWORD: acceptance-only-password

    steps:
      - uses: actions/checkout@v7
      - name: Install addons and their dependencies
        run: oca_install_addons
      - name: Initialize Odoo database
        run: oca_init_test_database
      - name: Install meeting addons
        run: >-
          odoo --database "$PGDATABASE"
          --init community_meetings,community_meetings_calendar,community_meetings_project
          --stop-after-init --http-interface=127.0.0.1
      - name: Create acceptance actors
        run: odoo shell --database "$PGDATABASE" < .github/scripts/bootstrap_acceptance_users.py
      - name: Install acceptance requirements and Chromium
        run: |
          python -m pip install -r tests/acceptance/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Test acceptance configuration and hooks
        env:
          PYTHONPATH: tests
        run: python -m unittest discover -s tests/acceptance/tests -v
      - name: Start Odoo
        run: |
          odoo --database "$PGDATABASE" --http-interface=0.0.0.0 --http-port=8069 \
            --workers=0 --max-cron-threads=0 > /tmp/odoo-acceptance.log 2>&1 &
          for attempt in $(seq 1 90); do
            if curl --fail --silent "http://127.0.0.1:8069/web/login?db=$PGDATABASE" >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/odoo-acceptance.log
          exit 1
      - name: Run all acceptance scenarios
        env:
          ODOO_ACCEPTANCE_ALLOW_DISPOSABLE: "1"
          ODOO_ACCEPTANCE_SCOPE: all
          ODOO_BASE_URL: http://127.0.0.1:8069
          ODOO_DB: acceptance
          ODOO_LOGIN: acceptance_editor
          ODOO_PASSWORD: acceptance-only-password
          ODOO_REVIEWER_LOGIN: acceptance_approver
          ODOO_REVIEWER_PASSWORD: acceptance-only-password
          ODOO_READER_LOGIN: acceptance_reader
          ODOO_READER_PASSWORD: acceptance-only-password
        run: >-
          python -m behave tests/acceptance/features
          --junit --junit-directory /tmp/acceptance-junit
      - name: Upload failure evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-results
          retention-days: 7
          path: |
            /tmp/odoo-acceptance-artifacts/
            /tmp/acceptance-junit/
            /tmp/odoo-acceptance.log
          if-no-files-found: ignore
