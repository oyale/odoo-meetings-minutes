repos:
  - repo: https://github.com/twisted/towncrier
    rev: 23.11.0
    hooks:
      - id: towncrier-check
        args: [--config=towncrier.toml, --compare-with=origin/18.0]
        files: ^(community_meetings|community_meetings_calendar|community_meetings_project|community_meetings_extension_demo)/
        pass_filenames: false
  - repo: https://github.com/sbidoul/whool
    rev: v1.3
    hooks:
      - id: whool-init
  - repo: https://github.com/OCA/odoo-pre-commit-hooks
    rev: v0.0.33
    hooks:
      - id: oca-checks-odoo-module
      - id: oca-checks-po
        args: [--disable=po-pretty-format]
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        exclude: ^\.github/workflows/.*\.yml$
      - id: check-added-large-files
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.8
    hooks:
      - id: ruff
        args: [--fix]
        exclude: ^(community_meetings.*/tests/browser/|docs/)
      - id: ruff-format
        exclude: ^(community_meetings.*/tests/browser/|docs/)
  - repo: https://github.com/OCA/maintainer-tools
    rev: bf9ecb9938b6a5deca0ff3d870fbd3f33341fded
    hooks:
      - id: oca-gen-addon-readme
        exclude: ^(community_meetings|community_meetings_project|community_meetings_calendar|community_meetings_extension_demo)/readme/newsfragments/
        args:
          [--addons-dir=., --repo-name=odoo-meetings-minutes, --branch=18.0, --org-name=oyale, --convert-fragments-to-markdown]
        always_run: false
        files: ^(community_meetings|community_meetings_project|community_meetings_calendar|community_meetings_extension_demo)/(readme/.*|__manifest__\.py)$
      - id: oca-gen-metapackage
        args: [odoo-addons-oyale-meeting-minutes]
        always_run: false
        files: ^(community_meetings|community_meetings_project|community_meetings_calendar|community_meetings_extension_demo)/__manifest__\.py$
      - id: oca-gen-addons-table
        stages: [manual]
