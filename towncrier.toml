[tool.towncrier]
# Keep per-addon fragments and publish their combined release history at root.
name = "Odoo Meetings Minutes"
directory = "."
filename = "CHANGELOG.md"
start_string = "<!-- towncrier release notes start -->"
title_format = "## {name} {version} ({project_date})"

[[tool.towncrier.section]]
name = "Community Meetings"
path = "community_meetings/readme/newsfragments"

[[tool.towncrier.section]]
name = "Calendar Integration"
path = "community_meetings_calendar/readme/newsfragments"

[[tool.towncrier.section]]
name = "Project Integration"
path = "community_meetings_project/readme/newsfragments"

[[tool.towncrier.section]]
name = "Extension Demo"
path = "community_meetings_extension_demo/readme/newsfragments"
